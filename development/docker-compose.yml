services:
  frontend:
    image: ghcr.io/astrolumina-rise-n-shine/astrolumina-frontend:${FRONTEND_DOCKER_IMAGE_TAG}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - astrology-api
      - booking-api
      - payment-api
    environment:
      - NODE_ENV=${NODE_ENV}
      - FRONTEND_SERVER_PORT=${FRONTEND_SERVER_PORT}
      - FRONTEND_SENTRY_DSN=${FRONTEND_SENTRY_DSN}
      - REVOLUT_PAY_PUBLIC_KEY=${REVOLUT_PAY_PUBLIC_KEY}
      - REVOLUT_PAY_API_VERSION=${REVOLUT_PAY_API_VERSION}
      - R2_BASE_URL=${R2_BASE_URL}
      - ASTROLOGY_API_URL=${ASTROLOGY_API_DC_URL}
      - PAYMENT_API_URL=${PAYMENT_API_DC_URL}
      - BOOKING_API_URL=${BOOKING_API_DC_URL}
      - ASTROLOGY_API_SERVER_DC_PORT=${ASTROLOGY_API_SERVER_DC_PORT}
      - ASTROLOGY_API_SERVER_DC_DNS=${ASTROLOGY_API_SERVER_DC_DNS}
      - ASTROLOGY_API_SERVER_K8S_PORT=${ASTROLOGY_API_SERVER_K8S_PORT}
      - ASTROLOGY_API_SERVER_K8S_DNS=${ASTROLOGY_API_SERVER_K8S_DNS}
      - BOOKING_API_SERVER_DC_PORT=${BOOKING_API_SERVER_DC_PORT}
      - BOOKING_API_SERVER_DC_DNS=${BOOKING_API_SERVER_DC_DNS}
      - BOOKING_API_SERVER_K8S_PORT=${BOOKING_API_SERVER_K8S_PORT}
      - BOOKING_API_SERVER_K8S_DNS=${BOOKING_API_SERVER_K8S_DNS}
      - PAYMENT_API_SERVER_DC_PORT=${PAYMENT_API_SERVER_DC_PORT}
      - PAYMENT_API_SERVER_DC_DNS=${PAYMENT_API_SERVER_DC_DNS}
      - PAYMENT_API_SERVER_K8S_PORT=${PAYMENT_API_SERVER_K8S_PORT}
      - PAYMENT_API_SERVER_K8S_DNS=${PAYMENT_API_SERVER_K8S_DNS}
      - FRONTEND_SERVER_DC_PORT=${FRONTEND_SERVER_DC_PORT}
      - FRONTEND_SERVER_DC_DNS=${FRONTEND_SERVER_DC_DNS}
      - FRONTEND_SERVER_K8S_PORT=${FRONTEND_SERVER_K8S_PORT}
      - FRONTEND_SERVER_K8S_DNS=${FRONTEND_SERVER_K8S_DNS}
    ports:
      - "${FRONTEND_SERVER_DC_PORT}:8080"
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8080" ]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.2"
          memory: 64M
        reservations:
          cpus: "0.025"
          memory: 16M
    networks:
      - astrolumina-development

  astrology-api:
    image: ghcr.io/astrolumina-rise-n-shine/astrolumina-astrologyapi:${ASTROLOGY_API_DOCKER_IMAGE_TAG}
    pull_policy: always
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV}
      - ASTROLOGY_API_SERVER_PORT=${ASTROLOGY_API_SERVER_PORT}
      - ASTROLOGY_API_SENTRY_DSN=${ASTROLOGY_API_SENTRY_DSN}
      - ASTROLOGER_API_KEY=${ASTROLOGER_API_KEY}
      - ASTROLOGER_API_URL=${ASTROLOGER_API_URL}
      - ASTROLOGER_API_HOST=${ASTROLOGER_API_HOST}
      - ASTROLOGY_API_SERVER_DC_PORT=${ASTROLOGY_API_SERVER_DC_PORT}
      - ASTROLOGY_API_SERVER_DC_DNS=${ASTROLOGY_API_SERVER_DC_DNS}
      - ASTROLOGY_API_SERVER_K8S_PORT=${ASTROLOGY_API_SERVER_K8S_PORT}
      - ASTROLOGY_API_SERVER_K8S_DNS=${ASTROLOGY_API_SERVER_K8S_DNS}
      - BOOKING_API_SERVER_DC_PORT=${BOOKING_API_SERVER_DC_PORT}
      - BOOKING_API_SERVER_DC_DNS=${BOOKING_API_SERVER_DC_DNS}
      - BOOKING_API_SERVER_K8S_PORT=${BOOKING_API_SERVER_K8S_PORT}
      - BOOKING_API_SERVER_K8S_DNS=${BOOKING_API_SERVER_K8S_DNS}
      - PAYMENT_API_SERVER_DC_PORT=${PAYMENT_API_SERVER_DC_PORT}
      - PAYMENT_API_SERVER_DC_DNS=${PAYMENT_API_SERVER_DC_DNS}
      - PAYMENT_API_SERVER_K8S_PORT=${PAYMENT_API_SERVER_K8S_PORT}
      - PAYMENT_API_SERVER_K8S_DNS=${PAYMENT_API_SERVER_K8S_DNS}
      - FRONTEND_SERVER_DC_PORT=${FRONTEND_SERVER_DC_PORT}
      - FRONTEND_SERVER_DC_DNS=${FRONTEND_SERVER_DC_DNS}
      - FRONTEND_SERVER_K8S_PORT=${FRONTEND_SERVER_K8S_PORT}
      - FRONTEND_SERVER_K8S_DNS=${FRONTEND_SERVER_K8S_DNS}
    ports:
      - "${ASTROLOGY_API_SERVER_DC_PORT}:${ASTROLOGY_API_SERVER_PORT}"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:${ASTROLOGY_API_SERVER_PORT}/health",
        ]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.3"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 64M
    networks:
      - astrolumina-development

  booking-api:
    image: ghcr.io/astrolumina-rise-n-shine/astrolumina-bookingapi:${BOOKING_API_DOCKER_IMAGE_TAG}
    pull_policy: always
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV}
      - BOOKING_API_SERVER_PORT=${BOOKING_API_SERVER_PORT}
      - BOOKING_API_SENTRY_DSN=${BOOKING_API_SENTRY_DSN}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - CALCOM_API_KEY=${CALCOM_API_KEY}
      - CALCOM_BASE_URL=${CALCOM_BASE_URL}
      - R2_BASE_URL=${R2_BASE_URL}
      - D1_ACCOUNT_ID=${D1_ACCOUNT_ID}
      - D1_DATABASE_ID=${D1_DATABASE_ID}
      - D1_API_TOKEN=${D1_API_TOKEN}
      - ASTROLOGY_API_SERVER_DC_PORT=${ASTROLOGY_API_SERVER_DC_PORT}
      - ASTROLOGY_API_SERVER_DC_DNS=${ASTROLOGY_API_SERVER_DC_DNS}
      - ASTROLOGY_API_SERVER_K8S_PORT=${ASTROLOGY_API_SERVER_K8S_PORT}
      - ASTROLOGY_API_SERVER_K8S_DNS=${ASTROLOGY_API_SERVER_K8S_DNS}
      - BOOKING_API_SERVER_DC_PORT=${BOOKING_API_SERVER_DC_PORT}
      - BOOKING_API_SERVER_DC_DNS=${BOOKING_API_SERVER_DC_DNS}
      - BOOKING_API_SERVER_K8S_PORT=${BOOKING_API_SERVER_K8S_PORT}
      - BOOKING_API_SERVER_K8S_DNS=${BOOKING_API_SERVER_K8S_DNS}
      - PAYMENT_API_SERVER_DC_PORT=${PAYMENT_API_SERVER_DC_PORT}
      - PAYMENT_API_SERVER_DC_DNS=${PAYMENT_API_SERVER_DC_DNS}
      - PAYMENT_API_SERVER_K8S_PORT=${PAYMENT_API_SERVER_K8S_PORT}
      - PAYMENT_API_SERVER_K8S_DNS=${PAYMENT_API_SERVER_K8S_DNS}
      - FRONTEND_SERVER_DC_PORT=${FRONTEND_SERVER_DC_PORT}
      - FRONTEND_SERVER_DC_DNS=${FRONTEND_SERVER_DC_DNS}
      - FRONTEND_SERVER_K8S_PORT=${FRONTEND_SERVER_K8S_PORT}
      - FRONTEND_SERVER_K8S_DNS=${FRONTEND_SERVER_K8S_DNS}
    ports:
      - "${BOOKING_API_SERVER_DC_PORT}:${BOOKING_API_SERVER_PORT}"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:${BOOKING_API_SERVER_PORT}/health",
        ]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.3"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 64M
    networks:
      - astrolumina-development

  payment-api:
    image: ghcr.io/astrolumina-rise-n-shine/astrolumina-paymentapi:${PAYMENT_API_DOCKER_IMAGE_TAG}
    pull_policy: always
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV}
      - PAYMENT_API_SERVER_PORT=${PAYMENT_API_SERVER_PORT}
      - PAYMENT_API_SENTRY_DSN=${PAYMENT_API_SENTRY_DSN}
      - REVOLUT_PAY_API_VERSION=${REVOLUT_PAY_API_VERSION}
      - REVOLUT_PAY_SECRET_KEY=${REVOLUT_PAY_SECRET_KEY}
      - ASTROLOGY_API_SERVER_DC_PORT=${ASTROLOGY_API_SERVER_DC_PORT}
      - ASTROLOGY_API_SERVER_DC_DNS=${ASTROLOGY_API_SERVER_DC_DNS}
      - ASTROLOGY_API_SERVER_K8S_PORT=${ASTROLOGY_API_SERVER_K8S_PORT}
      - ASTROLOGY_API_SERVER_K8S_DNS=${ASTROLOGY_API_SERVER_K8S_DNS}
      - BOOKING_API_SERVER_DC_PORT=${BOOKING_API_SERVER_DC_PORT}
      - BOOKING_API_SERVER_DC_DNS=${BOOKING_API_SERVER_DC_DNS}
      - BOOKING_API_SERVER_K8S_PORT=${BOOKING_API_SERVER_K8S_PORT}
      - BOOKING_API_SERVER_K8S_DNS=${BOOKING_API_SERVER_K8S_DNS}
      - PAYMENT_API_SERVER_DC_PORT=${PAYMENT_API_SERVER_DC_PORT}
      - PAYMENT_API_SERVER_DC_DNS=${PAYMENT_API_SERVER_DC_DNS}
      - PAYMENT_API_SERVER_K8S_PORT=${PAYMENT_API_SERVER_K8S_PORT}
      - PAYMENT_API_SERVER_K8S_DNS=${PAYMENT_API_SERVER_K8S_DNS}
      - FRONTEND_SERVER_DC_PORT=${FRONTEND_SERVER_DC_PORT}
      - FRONTEND_SERVER_DC_DNS=${FRONTEND_SERVER_DC_DNS}
      - FRONTEND_SERVER_K8S_PORT=${FRONTEND_SERVER_K8S_PORT}
      - FRONTEND_SERVER_K8S_DNS=${FRONTEND_SERVER_K8S_DNS}
    ports:
      - "${PAYMENT_API_SERVER_DC_PORT}:${PAYMENT_API_SERVER_PORT}"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:${PAYMENT_API_SERVER_PORT}/health",
        ]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.3"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 64M
    networks:
      - astrolumina-development

networks:
  astrolumina-development:
    name: astrolumina-development
    driver: bridge

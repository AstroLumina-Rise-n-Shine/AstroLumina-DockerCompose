# CI for the central Docker Compose repo: lint, validate, scan.
# Runs for pull requests targeting main. Manual deployment is in deploy.yml.
---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # YAML style consistency across compose files and Traefik configs.
  yaml-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install yamllint==1.38.0
      - run: yamllint development staging production

  # Full interpolation check: every ${VAR} referenced by the compose files
  # must resolve from the committed .env.example skeletons.
  compose-validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate development stack
        working-directory: development
        # The dev stack publishes host ports, but .env.example only carries
        # "..." placeholders there, so validation-only dummy values are
        # injected (shell env wins over --env-file). Container ports use the
        # real service listen ports.
        run: |
          FRONTEND_SERVER_DC_PORT=8080 \
          ASTROLOGY_API_SERVER_DC_PORT=8081 ASTROLOGY_API_SERVER_PORT=3031 \
          BOOKING_API_SERVER_DC_PORT=8082 BOOKING_API_SERVER_PORT=3033 \
          PAYMENT_API_SERVER_DC_PORT=8083 PAYMENT_API_SERVER_PORT=3032 \
          docker compose --env-file .env.example -f docker-compose.yml config --quiet
      - name: Validate staging stack (base + blue + green)
        working-directory: staging
        run: >
          docker compose --env-file .env.example
          -f docker-compose.yml -f docker-compose.blue.yml -f docker-compose.green.yml
          config --quiet
      - name: Validate production stack (base + blue + green)
        working-directory: production
        run: >
          docker compose --env-file .env.example
          -f docker-compose.yml -f docker-compose.blue.yml -f docker-compose.green.yml
          config --quiet

  # Shell safety for helper scripts (aliases holds functions only, so just a syntax check there).
  shellcheck:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: shellcheck --severity=warning refresh.sh
      - run: bash -n refresh.sh && bash -n aliases

  # Misconfiguration scan (ports, Traefik exposure, image tags). Fails the
  # build on HIGH/CRITICAL and uploads SARIF to the Security tab.
  trivy-config:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@87ef0dc97def48aa960fbf026a2563ee9dbdb470 # v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # Secret scan with the pinned OSS binary (the official action needs a paid
  # license on org repos). Full-history scan; known placeholders and one
  # burned historic PAT are allowlisted in .gitleaks.toml.
  gitleaks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: >
          curl -sL -o gitleaks.tar.gz
          https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          && tar xzf gitleaks.tar.gz gitleaks && sudo install gitleaks /usr/local/bin/gitleaks
      - run: gitleaks detect --source . --config .gitleaks.toml --verbose --exit-code 1

  semgrep:
    if: github.event_name == 'pull_request'
    name: Semgrep OSS
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.182.0
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run Semgrep
        id: semgrep
        run: semgrep --config p/default --jobs 1 --sarif --output=semgrep.sarif
      - name: Upload SARIF to GitHub
        if: always() && steps.semgrep.outcome == 'success'
        uses: github/codeql-action/upload-sarif@87ef0dc97def48aa960fbf026a2563ee9dbdb470 # v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
